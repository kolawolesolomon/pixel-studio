name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Verify browser interactions in Chrome
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-audit --no-fund playwright@1.58.2
          node --test browser.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-studio-preview
          path: pixel-studio.png
